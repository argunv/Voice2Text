version: 1
formatters:
  default:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    level: DEBUG
  file:
    class: logging.FileHandler
    formatter: default
    filename: logs/app.log
    level: INFO

loggers:
  app:
    level: DEBUG
    handlers:
      - console
      - file
    propagate: no

root:
  level: INFO
  handlers:
    - console
